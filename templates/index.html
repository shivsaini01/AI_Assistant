<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>J.A.R.V.I.S</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; padding: 0; }

    :root {
        --bg-0: #05070a;
        --bg-1: #0a0e14;
        --bg-2: #11161e;
        --text-primary: #eef1f6;
        --text-secondary: #a2acbd;
        --text-muted: #6b7487;
        --accent: #4ea8ff;
        --accent-dim: #2b7fd4;
        --accent-glow: rgba(78, 168, 255, 0.35);
        --success: #3ddc84;
        --danger: #ff5c5c;
        --warning: #ffb84a;
        --border-soft: rgba(255, 255, 255, 0.06);
        --border-mid: rgba(255, 255, 255, 0.09);
        --border-strong: rgba(255, 255, 255, 0.16);
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
    }

    body {
        font-family: Inter, -apple-system, BlinkMacSystemFont,
                     "Segoe UI", Roboto, Arial, sans-serif;
        font-size: 15px;
        color: var(--text-primary);
        background: var(--bg-0);
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        -webkit-tap-highlight-color: transparent;
        background-image:
            radial-gradient(ellipse 80% 60% at 50% -10%,
                rgba(78, 168, 255, 0.10), transparent 60%),
            radial-gradient(ellipse 60% 50% at 50% 110%,
                rgba(78, 168, 255, 0.05), transparent 60%);
    }

    /* ==========================================
       CONTAINER
       ========================================== */

    .jarvis-container {
        width: 100%;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        max-width: 960px;
        margin: 0 auto;
        background: linear-gradient(180deg,
            rgba(11, 15, 22, 0.94) 0%,
            rgba(7, 10, 15, 0.96) 100%);
        border-left: 1px solid var(--border-soft);
        border-right: 1px solid var(--border-soft);
        position: relative;
    }

    /* ==========================================
       HEADER
       ========================================== */

    .header {
        flex: 0 0 auto;
        height: 68px;
        padding: 0 22px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--border-soft);
        background: rgba(10, 14, 20, 0.85);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        z-index: 10;
    }

    .brand { display: flex; align-items: center; gap: 12px; }

    .brand-mark {
        width: 34px; height: 34px;
        border-radius: 10px;
        display: flex; align-items: center; justify-content: center;
        background: linear-gradient(135deg, var(--accent), var(--accent-dim));
        color: #fff;
        font-size: 15px; font-weight: 700;
        box-shadow:
            0 4px 14px rgba(78, 168, 255, 0.35),
            inset 0 1px 0 rgba(255, 255, 255, 0.25);
    }

    .brand-text { display: flex; flex-direction: column; gap: 2px; }

    .brand-title {
        margin: 0;
        font-size: 15px; font-weight: 700;
        letter-spacing: 1.5px;
    }

    .brand-subtitle {
        font-size: 10.5px; font-weight: 500;
        letter-spacing: 0.6px;
        color: var(--text-muted);
        text-transform: uppercase;
    }

    .status-pill {
        display: inline-flex; align-items: center; gap: 7px;
        padding: 6px 11px;
        border-radius: 100px;
        border: 1px solid var(--border-soft);
        background: rgba(255, 255, 255, 0.03);
        font-size: 11.5px; font-weight: 500;
        color: var(--text-secondary);
    }

    .status-dot {
        width: 7px; height: 7px; border-radius: 50%;
        background: var(--success);
        box-shadow: 0 0 7px rgba(61, 220, 132, 0.55);
    }

    /* ==========================================
       CHAT
       ========================================== */

    .chat {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 26px 22px 40px;
        scroll-behavior: smooth;
        scrollbar-width: thin;
        scrollbar-color: #2a3341 transparent;
    }

    .chat::-webkit-scrollbar { width: 8px; }
    .chat::-webkit-scrollbar-track { background: transparent; }
    .chat::-webkit-scrollbar-thumb {
        background: #2a3341;
        border-radius: 20px;
    }

    /* ==========================================
       EMPTY STATE
       ========================================== */

    .empty-state {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 60px 20px;
        text-align: center;
        color: var(--text-muted);
    }

    .empty-state-mark {
        width: 56px; height: 56px;
        border-radius: 16px;
        display: flex; align-items: center; justify-content: center;
        background: rgba(78, 168, 255, 0.08);
        border: 1px solid rgba(78, 168, 255, 0.18);
        color: var(--accent);
        font-size: 22px; font-weight: 700;
    }

    .empty-state h2 {
        margin: 6px 0 0;
        font-size: 17px; font-weight: 600;
        color: var(--text-primary);
    }

    .empty-state p {
        margin: 0;
        max-width: 320px;
        font-size: 13.5px; line-height: 1.55;
    }

    /* ==========================================
       MESSAGES
       ========================================== */

    .message-row {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        margin-bottom: 18px;
        animation: messageAppear 0.24s cubic-bezier(0.2, 0.7, 0.3, 1);
    }

    .message-row.user { flex-direction: row-reverse; }

    @keyframes messageAppear {
        from { opacity: 0; transform: translateY(6px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    .avatar {
        flex: 0 0 auto;
        width: 30px; height: 30px;
        margin-top: 2px;
        border-radius: 9px;
        display: flex; align-items: center; justify-content: center;
        font-size: 12.5px; font-weight: 700;
    }

    .message-row.jarvis .avatar {
        background: linear-gradient(135deg, var(--accent), var(--accent-dim));
        color: #fff;
        box-shadow: 0 3px 10px rgba(78, 168, 255, 0.28);
    }

    .message-row.user .avatar {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid var(--border-mid);
        color: var(--text-secondary);
    }

    .bubble-wrap {
        display: flex; flex-direction: column;
        max-width: min(76%, 640px);
        min-width: 0;
    }

    .message-row.user .bubble-wrap { align-items: flex-end; }

    .bubble {
        padding: 11px 15px;
        font-size: 14.5px;
        line-height: 1.55;
        word-break: break-word;
        white-space: pre-wrap;
        border-radius: 14px;
        box-shadow: var(--shadow-sm);
    }

    .message-row.jarvis .bubble {
        background: linear-gradient(180deg, #182029 0%, #141a22 100%);
        border: 1px solid var(--border-mid);
        border-top-left-radius: 5px;
    }

    .message-row.user .bubble {
        background: linear-gradient(180deg,
            rgba(78, 168, 255, 0.14),
            rgba(78, 168, 255, 0.09));
        border: 1px solid rgba(78, 168, 255, 0.22);
        border-top-right-radius: 5px;
        color: #eaf3ff;
    }

    .message-row.jarvis.error .bubble {
        border-color: rgba(255, 92, 92, 0.28);
        background: rgba(255, 92, 92, 0.07);
        color: #ffd9d9;
    }

    .meta {
        margin-top: 5px;
        padding: 0 4px;
        font-size: 10.5px; font-weight: 500;
        color: var(--text-muted);
    }

    /* ==========================================
       TYPING
       ========================================== */

    .typing .bubble {
        display: flex; align-items: center; gap: 5px;
        padding: 14px 16px;
    }

    .typing .dot {
        width: 6px; height: 6px;
        border-radius: 50%;
        background: var(--text-secondary);
        animation: typingPulse 1.2s infinite ease-in-out;
    }

    .typing .dot:nth-child(2) { animation-delay: 0.15s; }
    .typing .dot:nth-child(3) { animation-delay: 0.30s; }

    @keyframes typingPulse {
        0%, 60%, 100% { opacity: 0.28; transform: translateY(0); }
        30%           { opacity: 1; transform: translateY(-3px); }
    }

    /* ==========================================
       INPUT AREA
       ========================================== */

    .input-area {
        flex: 0 0 auto;
        position: relative;
        z-index: 20;
        padding: 12px 22px calc(16px + env(safe-area-inset-bottom));
        background: linear-gradient(180deg,
            rgba(7, 10, 15, 0) 0%,
            rgba(7, 10, 15, 0.75) 30%,
            rgba(7, 10, 15, 0.96) 100%);
    }

    .input-hint {
        text-align: center;
        font-size: 10.5px;
        font-weight: 500;
        letter-spacing: 0.3px;
        color: var(--text-muted);
        margin: 0 0 8px;
        opacity: 0;
        transform: translateY(3px);
        transition: opacity 0.3s ease, transform 0.3s ease;
        pointer-events: none;
        user-select: none;
    }

    .input-hint.show {
        opacity: 0.75;
        transform: translateY(0);
    }

    .input-hint kbd {
        display: inline-block;
        padding: 1px 5px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid var(--border-mid);
        font-family: inherit;
        font-size: 10px;
        font-weight: 600;
        color: var(--text-secondary);
    }

    .input-bar {
        display: flex;
        align-items: flex-end;
        gap: 8px;

        padding: 5px 8px 8px 8px;
        border-radius: 18px;

        background: linear-gradient(180deg,
            rgba(24, 30, 40, 0.94) 0%,
            rgba(17, 22, 30, 0.94) 100%);

        border: 1px solid var(--border-mid);

        box-shadow:
            0 8px 30px rgba(0, 0, 0, 0.5),
            0 1px 0 rgba(255, 255, 255, 0.03) inset;

        transition:
            border-color 0.18s ease,
            box-shadow 0.18s ease,
            background 0.18s ease;
    }

    .input-bar:hover {
        border-color: var(--border-strong);
    }

    .input-bar:focus-within {
        border-color: rgba(78, 168, 255, 0.55);
        background: linear-gradient(180deg,
            rgba(28, 35, 46, 0.96) 0%,
            rgba(20, 25, 34, 0.96) 100%);
        box-shadow:
            0 8px 30px rgba(0, 0, 0, 0.5),
            0 0 0 4px rgba(78, 168, 255, 0.10),
            0 0 24px rgba(78, 168, 255, 0.08);
    }

    .input-bar.error {
        border-color: rgba(255, 92, 92, 0.45);
        box-shadow:
            0 8px 30px rgba(0, 0, 0, 0.5),
            0 0 0 4px rgba(255, 92, 92, 0.08);
    }

    .input-bar textarea {
        flex: 1;
        min-width: 0;

        border: none;
        outline: none;
        background: transparent;

        padding: 12px 0;

        color: var(--text-primary);
        font-family: inherit;
        font-size: 15px;
        line-height: 1.45;

        resize: none;
        overflow-y: auto;

        max-height: 140px;

        scrollbar-width: thin;
        scrollbar-color: #2a3341 transparent;
    }

    .input-bar textarea::-webkit-scrollbar { width: 6px; }
    .input-bar textarea::-webkit-scrollbar-thumb {
        background: #2a3341;
        border-radius: 20px;
    }

    .input-bar textarea::placeholder {
        color: var(--text-muted);
        transition: opacity 0.2s ease;
    }

    .input-bar textarea:disabled {
        opacity: 0.55;
    }

    .clear-btn {
        flex: 0 0 auto;

        width: 30px;
        height: 30px;

        margin-bottom: 7px;

        border: none;
        border-radius: 8px;
        background: transparent;
        color: var(--text-muted);

        display: flex;
        align-items: center;
        justify-content: center;

        cursor: pointer;

        opacity: 0;
        transform: scale(0.8);
        pointer-events: none;

        transition:
            opacity 0.15s ease,
            transform 0.15s ease,
            background 0.15s ease,
            color 0.15s ease;
    }

    .clear-btn.show {
        opacity: 1;
        transform: scale(1);
        pointer-events: auto;
    }

    .clear-btn:hover {
        background: rgba(255, 255, 255, 0.06);
        color: var(--text-secondary);
    }

    .clear-btn:active {
        transform: scale(0.9);
    }

    .clear-btn svg {
        width: 14px;
        height: 14px;
    }

    .send-btn {
        flex: 0 0 auto;

        width: 44px;
        height: 44px;

        border: none;
        border-radius: 14px;

        display: flex;
        align-items: center;
        justify-content: center;

        background: linear-gradient(135deg, var(--accent), var(--accent-dim));
        color: #fff;

        cursor: pointer;

        position: relative;
        overflow: hidden;

        box-shadow:
            0 4px 14px rgba(78, 168, 255, 0.35),
            inset 0 1px 0 rgba(255, 255, 255, 0.22);

        transition:
            transform 0.12s ease,
            box-shadow 0.15s ease,
            filter 0.15s ease,
            opacity 0.15s ease;
    }

    .send-btn:hover:not(:disabled) {
        filter: brightness(1.08);
        box-shadow:
            0 6px 20px rgba(78, 168, 255, 0.5),
            inset 0 1px 0 rgba(255, 255, 255, 0.28);
    }

    .send-btn:active:not(:disabled) {
        transform: scale(0.94);
    }

    .send-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
        box-shadow: none;
    }

    .send-btn .icon-arrow,
    .send-btn .icon-spinner {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.18s ease, transform 0.18s ease;
    }

    .send-btn .icon-arrow svg {
        width: 17px;
        height: 17px;
    }

    .send-btn .icon-spinner {
        opacity: 0;
        transform: scale(0.6);
    }

    .send-btn .icon-spinner svg {
        width: 18px;
        height: 18px;
        animation: spin 0.9s linear infinite;
    }

    .send-btn.sending .icon-arrow {
        opacity: 0;
        transform: scale(0.6);
    }

    .send-btn.sending .icon-spinner {
        opacity: 1;
        transform: scale(1);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }

    /* ==========================================
       MOBILE
       ========================================== */

    @media (max-width: 640px) {
        .jarvis-container {
            max-width: none;
            border-left: none;
            border-right: none;
        }

        .header {
            height: 60px;
            padding: 0 14px;
        }

        .brand-mark {
            width: 30px; height: 30px;
            border-radius: 9px;
            font-size: 13px;
        }

        .brand-title { font-size: 13.5px; }
        .brand-subtitle { font-size: 9.5px; }

        .status-pill { padding: 5px 9px; font-size: 10.5px; }

        .chat { padding: 18px 14px 24px; }

        .bubble-wrap { max-width: 84%; }

        .bubble { font-size: 14px; padding: 10px 13px; }

        .avatar { width: 26px; height: 26px; border-radius: 8px; font-size: 11px; }

        .input-area {
            padding: 8px 12px calc(12px + env(safe-area-inset-bottom));
        }

        .input-hint { display: none; }

        .input-bar {
            padding: 6px 6px 6px 14px;
            border-radius: 16px;
        }

        .input-bar textarea {
            font-size: 16px;
            padding: 11px 0;
        }

        .send-btn { width: 42px; height: 42px; border-radius: 13px; }
    }

    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
            animation-duration: 0.01ms !important;
            animation-iteration-count: 1 !important;
            transition-duration: 0.01ms !important;
            scroll-behavior: auto !important;
        }
    }
</style>
</head>

<body>

<div class="jarvis-container">

    <!-- HEADER -->
    <header class="header">
        <div class="brand">
            <div class="brand-mark">J</div>
            <div class="brand-text">
                <h1 class="brand-title">J.A.R.V.I.S</h1>
            </div>
        </div>
        <div class="status-pill">
            <span class="status-dot"></span>
            <span>Online</span>
        </div>
    </header>

    <!-- CHAT -->
    <main class="chat" id="chat"></main>

    <!-- INPUT -->
    <div class="input-area">

        <p class="input-hint" id="inputHint">
            <kbd>Enter</kbd> to send &nbsp;·&nbsp; <kbd>Shift</kbd> + <kbd>Enter</kbd> for a new line
        </p>

        <div class="input-bar" id="inputBar">

            <textarea
                id="commandInput"
                placeholder="Ask Jarvis anything…"
                rows="1"
                autocomplete="off"
                autocapitalize="sentences"
                spellcheck="false"
                enterkeyhint="send"
            ></textarea>

            <button
                id="clearBtn"
                class="clear-btn"
                type="button"
                tabindex="-1"
                aria-label="Clear input"
            >
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>

            <button
                id="sendBtn"
                class="send-btn"
                type="button"
                aria-label="Send message"
            >
                <span class="icon-arrow">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="19" x2="12" y2="5"></line>
                        <polyline points="5 12 12 5 19 12"></polyline>
                    </svg>
                </span>
                <span class="icon-spinner">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12a9 9 0 1 1-6.219-8.56"></path>
                    </svg>
                </span>
            </button>

        </div>
    </div>

</div>

<script>
(function () {
    "use strict";

    const input      = document.getElementById("commandInput");
    const inputBar   = document.getElementById("inputBar");
    const clearBtn   = document.getElementById("clearBtn");
    const sendBtn    = document.getElementById("sendBtn");
    const chat       = document.getElementById("chat");
    const inputHint  = document.getElementById("inputHint");

    const HISTORY_KEY = "jarvis.chat.history.v4";
    const MAX_ROWS_PX = 140;

    let isSending = false;
    let typingRow = null;

    /* ==========================================
       TIME
       ========================================== */

    function nowLabel() {
        const d = new Date();
        let h = d.getHours();
        const m = String(d.getMinutes()).padStart(2, "0");
        const ap = h >= 12 ? "PM" : "AM";
        h = h % 12 || 12;
        return h + ":" + m + " " + ap;
    }

    /* ==========================================
       EMPTY STATE
       ========================================== */

    function renderEmptyState() {
        chat.innerHTML = "";
        const wrap = document.createElement("div");
        wrap.className = "empty-state";
        wrap.innerHTML =
            '<div class="empty-state-mark">J</div>' +
            '<h2>Hello, sir.</h2>' +
            '<p>Ask me to open apps, search the web, find files, or just chat.</p>';
        chat.appendChild(wrap);
    }

    function removeEmptyState() {
        const empty = chat.querySelector(".empty-state");
        if (empty) empty.remove();
    }

    /* ==========================================
       MESSAGES
       ========================================== */

    function appendMessage(text, type, options) {
        options = options || {};
        removeEmptyState();

        const row = document.createElement("div");
        row.className = "message-row " + (type === "user" ? "user" : "jarvis");
        if (options.error) row.classList.add("error");

        const avatar = document.createElement("div");
        avatar.className = "avatar";
        avatar.textContent = type === "user" ? "U" : "J";

        const wrap = document.createElement("div");
        wrap.className = "bubble-wrap";

        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = text;

        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = options.timestamp || nowLabel();

        wrap.appendChild(bubble);
        wrap.appendChild(meta);
        row.appendChild(avatar);
        row.appendChild(wrap);
        chat.appendChild(row);

        scrollToBottom();

        if (options.persist !== false) saveHistory();
        return row;
    }

    function scrollToBottom() {
        chat.scrollTop = chat.scrollHeight;
    }

    /* ==========================================
       TYPING
       ========================================== */

    function showTyping() {
        if (typingRow) return;
        removeEmptyState();

        typingRow = document.createElement("div");
        typingRow.className = "message-row jarvis typing";
        typingRow.innerHTML =
            '<div class="avatar">J</div>' +
            '<div class="bubble-wrap">' +
                '<div class="bubble">' +
                    '<span class="dot"></span>' +
                    '<span class="dot"></span>' +
                    '<span class="dot"></span>' +
                '</div>' +
            '</div>';

        chat.appendChild(typingRow);
        scrollToBottom();
    }

    function hideTyping() {
        if (!typingRow) return;
        typingRow.remove();
        typingRow = null;
    }

    /* ==========================================
       HISTORY
       ========================================== */

    function saveHistory() {
        try {
            const items = [];
            chat.querySelectorAll(".message-row").forEach(function (row) {
                if (row.classList.contains("typing")) return;

                const bubble = row.querySelector(".bubble");
                const meta   = row.querySelector(".meta");
                if (!bubble) return;

                items.push({
                    text: bubble.textContent,
                    type: row.classList.contains("user") ? "user" : "jarvis",
                    error: row.classList.contains("error"),
                    timestamp: meta ? meta.textContent : nowLabel()
                });
            });
            sessionStorage.setItem(HISTORY_KEY, JSON.stringify(items));
        } catch (_) { /* ignore */ }
    }

    function loadHistory() {
        try {
            const raw = sessionStorage.getItem(HISTORY_KEY);
            if (!raw) { renderEmptyState(); return; }

            const items = JSON.parse(raw);
            if (!Array.isArray(items) || items.length === 0) {
                renderEmptyState(); return;
            }

            chat.innerHTML = "";
            items.forEach(function (item) {
                appendMessage(item.text, item.type, {
                    error: !!item.error,
                    timestamp: item.timestamp,
                    persist: false
                });
            });
        } catch (_) {
            renderEmptyState();
        }
    }

    /* ==========================================
       INPUT HELPERS
       ========================================== */

    function autoGrow() {
        input.style.height = "auto";
        const next = Math.min(input.scrollHeight, MAX_ROWS_PX);
        input.style.height = next + "px";
    }

    function refreshInputUI() {
        const hasText = input.value.length > 0;

        clearBtn.classList.toggle("show", hasText);
        inputHint.classList.toggle("show", hasText && !isSending);

        inputBar.classList.remove("error");
    }

    function setInputError(on) {
        inputBar.classList.toggle("error", !!on);
    }

    /* ==========================================
       SEND  (no timeout — Jarvis may take as long as it needs)
       ========================================== */

    async function sendMessage() {
        if (isSending) return;

        const text = input.value.trim();
        if (!text) return;

        appendMessage(text, "user");

        input.value = "";
        autoGrow();
        refreshInputUI();

        isSending = true;
        input.disabled = true;
        sendBtn.disabled = true;
        sendBtn.classList.add("sending");

        showTyping();

        try {
            const response = await fetch("/command", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ command: text })
            });

            let data = null;
            try { data = await response.json(); } catch (_) { /* ignore */ }

            hideTyping();

            if (response.ok && data && data.success) {
                appendMessage((data.message || "Done.").trim(), "jarvis");
            } else {
                const message = (data && data.message) ||
                                ("Server error (" + response.status + ")");
                appendMessage(message, "jarvis", { error: true });
            }

        } catch (error) {
            // Only fires if the network truly fails
            // (server not running, connection lost, CORS, DNS, etc.)
            hideTyping();
            appendMessage(
                "Could not reach the Jarvis server.",
                "jarvis", { error: true }
            );
            setInputError(true);

        } finally {
            isSending = false;
            input.disabled = false;
            sendBtn.disabled = false;
            sendBtn.classList.remove("sending");
            input.focus();
        }
    }

    /* ==========================================
       EVENTS
       ========================================== */

    input.addEventListener("input", function () {
        autoGrow();
        refreshInputUI();
    });

    input.addEventListener("keydown", function (event) {
        if (event.key === "Enter" && !event.shiftKey) {
            event.preventDefault();
            sendMessage();
            return;
        }

        if (event.key === "Escape") {
            if (input.value.length > 0) {
                event.preventDefault();
                input.value = "";
                autoGrow();
                refreshInputUI();
            }
        }
    });

    clearBtn.addEventListener("click", function (event) {
        event.preventDefault();
        input.value = "";
        autoGrow();
        refreshInputUI();
        input.focus();
    });

    sendBtn.addEventListener("click", function (event) {
        event.preventDefault();
        sendMessage();
    });

    /* ==========================================
       START
       ========================================== */

    loadHistory();
    autoGrow();
    refreshInputUI();

    setTimeout(function () { input.focus(); }, 50);

})();
</script>

</body>
</html>
